version: 2
mode: gate

trigger:
  on_code_change: true

checkers:
  test:
    enabled: true
    timeout: 120

policy:
  fail_on_test_failure: true
  fail_on_checker_error: true

gate:
  auto_execute_missing_evidence: true

repair:
  enabled: true
  max_attempts: 4
  max_same_failure: 2

feedback:
  stdout_tail: 3000
  stderr_tail: 5000
  max_chars: 8000

report:
  console: true
  markdown: true

output:
  max_stdout_chars: 10000
  max_stderr_chars: 10000
